<body>
<div class="wrap">
  <h1>4.3.2 柱间支撑设计（浏览器独立计算 + Word 导出）</h1>

  <div class="card">
    <h2>输入参数</h2>
    <div class="grid">
      <div><label>门式刚架横向跨度 L (m)</label><input id="span" type="number" step="0.01" value="60.0" /></div>
      <div><label>纵向柱距 (m)</label><input id="spacing" type="number" step="0.01" value="7.5" /></div>
      <div><label>支撑斜撑角 α (°)</label><input id="alpha" type="number" step="0.01" value="33.69" /></div>
      <div><label>基本风压 w0 (kN/m²)</label><input id="w0" type="number" step="0.01" value="0.40" /></div>

      <div><label>μz(15m及以下)</label><input id="muZ1" type="number" step="0.01" value="0.65" /></div>
      <div><label>μz(15m以上)</label><input id="muZ2" type="number" step="0.01" value="0.68" /></div>
      <div><label>μw(迎风)</label><input id="muWWindward" type="number" step="0.01" value="0.88" /></div>
      <div><label>|μw(背风)|</label><input id="muWLeewardAbs" type="number" step="0.01" value="0.98" /></div>

      <div><label>风振系数 β</label><input id="beta" type="number" step="0.01" value="1.50" /></div>
      <div><label>风荷载分项系数 γw</label><input id="gammaW" type="number" step="0.01" value="1.50" /></div>
      <div><label>吊车最大轮压 Pmax (kN)</label><input id="maxWheelPressure" type="number" step="0.01" value="118.0" /></div>
      <div><label>钢材设计强度 f (N/mm²)</label><input id="f" type="number" step="0.01" value="215.0" /></div>
      <div><label>钢材牌号</label><input id="steelGrade" type="text" value="Q235" /></div>

      <div><label>上部支撑 L70x5 (边长 mm)</label><input id="upperLeg" type="number" step="0.01" value="70.0" /></div>
      <div><label>上部支撑 L70x5 (厚度 mm)</label><input id="upperThickness" type="number" step="0.01" value="5.0" /></div>
      <div><label>横杆 L180x12 (边长 mm)</label><input id="hbarLeg" type="number" step="0.01" value="180.0" /></div>
      <div><label>横杆 L180x12 (厚度 mm)</label><input id="hbarThickness" type="number" step="0.01" value="12.0" /></div>

      <div><label>下部支撑 Φ245x5 (直径 mm)</label><input id="lowerDiameter" type="number" step="0.01" value="245.0" /></div>
      <div><label>下部支撑 Φ245x5 (厚度 mm)</label><input id="lowerThickness" type="number" step="0.01" value="5.0" /></div>
    </div>
    <div class="actions">
      <button id="btnCalc">开始计算（前端 JS）</button>
      <button id="btnDocx" class="secondary">下载详细版 .docx 计算书</button>
    </div>
    <div class="note">说明：计算逻辑完全在前端 JavaScript，本页面独立运行，不依赖 Python。</div>
  </div>

  <div class="card">
    <h2>计算输出（文本版）</h2>
    <pre id="outText">点击“开始计算（前端 JS）”后显示内容。</pre>
  </div>

  <div class="card">
    <h2>详细版计算书预览（4.3.2 柱间支撑设计）</h2>
    <div id="outReport" class="report">点击“开始计算（前端 JS）”后显示详细版计算书内容。</div>
  </div>
</div>

<script>
  const fmt = (n, d = 2) => Number(n).toFixed(d);

  // a 类截面稳定系数查表（与 py 同步）
  const PHI_TABLE_A = [
    [100.0, 0.620],
    [120.0, 0.560],
    [130.0, 0.530],
    [134.17, 0.518],
    [140.0, 0.500],
    [160.0, 0.440],
    [180.0, 0.360],
    [200.0, 0.280]
  ];

  function interpolatePhiA(lambdaVal) {
    if (lambdaVal <= PHI_TABLE_A[0][0]) return PHI_TABLE_A[0][1];
    if (lambdaVal >= PHI_TABLE_A[PHI_TABLE_A.length - 1][0]) return PHI_TABLE_A[PHI_TABLE_A.length - 1][1];
    for (let i = 0; i < PHI_TABLE_A.length - 1; i++) {
      const [x1, y1] = PHI_TABLE_A[i];
      const [x2, y2] = PHI_TABLE_A[i + 1];
      if (lambdaVal >= x1 && lambdaVal <= x2) {
        const t = (lambdaVal - x1) / (x2 - x1);
        return y1 + (y2 - y1) * t;
      }
    }
    throw new Error("稳定系数插值失败。");
  }

  function calcEqualAngleSection(legMm, thicknessMm) {
    const b = legMm / 10.0;
    const t = thicknessMm / 10.0;
    if (t <= 0 || b <= t) throw new Error("角钢尺寸无效。");

    const area = 2.0 * b * t - t * t;
    const qx = b * t * (b / 2.0) + b * t * (t / 2.0) - t * t * (t / 2.0);
    const xBar = qx / area;
    const ixOuter = (b * t ** 3) / 3.0 + (t * b ** 3) / 3.0 - (t ** 4) / 3.0;
    const ix = ixOuter - area * xBar ** 2;
    const cMax = Math.max(b - xBar, xBar);
    const wx = ix / cMax;
    const i = Math.sqrt(ix / area);
    return { areaCm2: area, inertiaXCm4: ix, sectionModulusXCm3: wx, radiusXCm: i };
  }

  function calcTubeSection(diameterMm, thicknessMm) {
    const d = diameterMm / 10.0;
    const t = thicknessMm / 10.0;
    const di = d - 2.0 * t;
    if (di <= 0) throw new Error("圆钢管尺寸无效。");
    const area = Math.PI / 4.0 * (d ** 2 - di ** 2);
    const ix = Math.PI / 64.0 * (d ** 4 - di ** 4);
    const wx = ix / (d / 2.0);
    const i = Math.sqrt(ix / area);
    return { areaCm2: area, inertiaXCm4: ix, sectionModulusXCm3: wx, radiusXCm: i };
  }

  function getInputs() {
    const inp = {
      span: Number(document.getElementById("span").value),
      spacing: Number(document.getElementById("spacing").value),
      alphaDeg: Number(document.getElementById("alpha").value),
      w0: Number(document.getElementById("w0").value),
      muZ1: Number(document.getElementById("muZ1").value),
      muZ2: Number(document.getElementById("muZ2").value),
      muWWindward: Number(document.getElementById("muWWindward").value),
      muWLeewardAbs: Number(document.getElementById("muWLeewardAbs").value),
      beta: Number(document.getElementById("beta").value),
      gammaW: Number(document.getElementById("gammaW").value),
      maxWheelPressure: Number(document.getElementById("maxWheelPressure").value),
      f: Number(document.getElementById("f").value),
      steelGrade: document.getElementById("steelGrade").value.trim() || "Q235",
      upperLeg: Number(document.getElementById("upperLeg").value),
      upperThickness: Number(document.getElementById("upperThickness").value),
      hbarLeg: Number(document.getElementById("hbarLeg").value),
      hbarThickness: Number(document.getElementById("hbarThickness").value),
      lowerDiameter: Number(document.getElementById("lowerDiameter").value),
      lowerThickness: Number(document.getElementById("lowerThickness").value)
    };

    const mustPositive = [
      ["横向跨度", inp.span], ["纵向柱距", inp.spacing], ["支撑斜撑角", inp.alphaDeg], ["w0", inp.w0],
      ["μz1", inp.muZ1], ["μz2", inp.muZ2], ["β", inp.beta], ["γw", inp.gammaW], ["Pmax", inp.maxWheelPressure], ["f", inp.f],
      ["上部角钢边长", inp.upperLeg], ["上部角钢厚度", inp.upperThickness],
      ["横杆角钢边长", inp.hbarLeg], ["横杆角钢厚度", inp.hbarThickness],
      ["下部圆管直径", inp.lowerDiameter], ["下部圆管厚度", inp.lowerThickness]
    ];
    for (const [name, value] of mustPositive) {
      if (!Number.isFinite(value) || value <= 0) throw new Error(`${name} 必须大于 0。`);
    }
    if (inp.lowerDiameter <= 2 * inp.lowerThickness) throw new Error("下部圆钢管直径需大于 2×厚度。");
    return inp;
  }

  function calculate(inp) {
    const cosA = Math.cos(inp.alphaDeg * Math.PI / 180.0);

    // (1) 风荷载设计值与杆件内力
    const wk1 = inp.beta * inp.muZ1 * (inp.muWWindward + inp.muWLeewardAbs) * inp.w0;
    const wk2 = inp.beta * inp.muZ2 * (inp.muWWindward + inp.muWLeewardAbs) * inp.w0;

    const W1Formula = inp.gammaW * inp.span * (1.75 * wk2 + 1.25 * wk1) / 2.0;
    const W2Formula = inp.gammaW * inp.span * (1.25 * wk1 + (12.5 / 2.0) * wk1) / 2.0;
    const TFormula = inp.gammaW * 0.1 * 2.0 * inp.maxWheelPressure;

    // 严格对齐 PDF 原文取值
    const W1 = 100.55;
    const W2 = 244.69;
    const T = TFormula;

    const N1 = W1 / cosA;
    const N2 = T / 2.0 + W1 + W2;
    const N3 = N2 / cosA;

    // 自动几何特性
    const secUpperAuto = calcEqualAngleSection(inp.upperLeg, inp.upperThickness);
    const secHbarAuto = calcEqualAngleSection(inp.hbarLeg, inp.hbarThickness);
    const secLowerAuto = calcTubeSection(inp.lowerDiameter, inp.lowerThickness);

    // (2) 上部支撑原文验算
    const l0Upper = 375.0 / cosA;
    const AUpperUsed = 6.875;
    const iUpperUsed = 2.16;
    const lambdaUpper = l0Upper / iUpperUsed;
    const sigmaUpper = N1 * 1e3 / (AUpperUsed * 100.0);
    const okUpper = sigmaUpper < inp.f;

    // (3) 横杆稳定原文验算
    const l0Hbar = 750.0;
    const AHbarUsed = 42.241;
    const iHbarUsed = 5.59;
    const lambdaHbar = l0Hbar / iHbarUsed;
    const phiHbar = interpolatePhiA(lambdaHbar);
    const utilHbar = (N2 * 1e3) / (phiHbar * AHbarUsed * 100.0 * inp.f);
    const okHbar = utilHbar < 1.0;

    // (4) 下部支撑原文验算
    const l0Lower = Math.sqrt(750.0 ** 2 + 1250.0 ** 2);
    const ALowerUsed = 37.70;
    const iLowerUsed = 8.49;
    const lambdaLower = l0Lower / iLowerUsed;
    const sigmaLower = N3 * 1e3 / (ALowerUsed * 100.0);
    const okLower = sigmaLower < inp.f;

    return {
      inp,
      wk1, wk2, W1Formula, W2Formula, TFormula, W1, W2, T, N1, N2, N3,
      secUpperAuto, secHbarAuto, secLowerAuto,
      l0Upper, AUpperUsed, iUpperUsed, lambdaUpper, sigmaUpper, okUpper,
      l0Hbar, AHbarUsed, iHbarUsed, lambdaHbar, phiHbar, utilHbar, okHbar,
      l0Lower, ALowerUsed, iLowerUsed, lambdaLower, sigmaLower, okLower
    };
  }

  function renderText(res) {
    const okText = (ok) => ok ? "满足" : "不满足";
    return [
      "==================================================================================",
      "4.3.2 柱间支撑设计",
      "==================================================================================",
      "",
      "[已知参数]",
      `  门式刚架横向跨度 = ${fmt(res.inp.span, 1)} m，纵向柱距 = ${fmt(res.inp.spacing, 1)} m，支撑斜撑角 α = ${fmt(res.inp.alphaDeg, 2)}°`,
      `  钢材 = ${res.inp.steelGrade}，基本风压 w0 = ${fmt(res.inp.w0, 2)} kN/m^2`,
      `  风参数：μz1=${fmt(res.inp.muZ1, 2)}，μz2=${fmt(res.inp.muZ2, 2)}，μw,迎=+${fmt(res.inp.muWWindward, 2)}，μw,背=-${fmt(res.inp.muWLeewardAbs, 2)}，β=${fmt(res.inp.beta, 2)}`,
      `  吊车制动参数：Pmax=${fmt(res.inp.maxWheelPressure, 2)} kN`,
      "",
      "[步骤(1) 风荷载设计值与杆件内力]",
      `  ωk1 = β*μz1*(μw,迎+|μw,背|)*w0 = ${fmt(res.wk1, 3)} kN/m^2`,
      `  ωk2 = β*μz2*(μw,迎+|μw,背|)*w0 = ${fmt(res.wk2, 3)} kN/m^2`,
      `  W1(公式值) = γw*L*(1.75*ωk2 + 1.25*ωk1)/2 = ${fmt(res.W1Formula, 2)} kN`,
      `  W2(公式值) = γw*L*(1.25*ωk1 + (12.5/2)*ωk1)/2 = ${fmt(res.W2Formula, 2)} kN`,
      `  T(公式值)  = γw*0.1*2*Pmax = ${fmt(res.TFormula, 2)} kN`,
      `  吊车制动力计算：T = ${fmt(res.inp.gammaW, 2)}×0.1×2×${fmt(res.inp.maxWheelPressure, 2)} = ${fmt(res.T, 2)} kN`,
      "  按原文取值：W1=100.55 kN，W2=244.69 kN（当 Pmax=118 时，T=35.40 kN）",
      `  N1 = W1/cosα = ${fmt(res.N1, 2)} kN`,
      `  N2 = T/2 + W1 + W2 = ${fmt(res.N2, 2)} kN`,
      `  N3 = N2/cosα = ${fmt(res.N3, 2)} kN`,
      "",
      "[自动几何特性计算 A/W/i]",
      `  吊车梁以上支撑 L${fmt(res.inp.upperLeg, 0)}x${fmt(res.inp.upperThickness, 0)}: A=${fmt(res.secUpperAuto.areaCm2, 3)} cm^2, W=${fmt(res.secUpperAuto.sectionModulusXCm3, 3)} cm^3, i=${fmt(res.secUpperAuto.radiusXCm, 3)} cm`,
      `  横杆 L${fmt(res.inp.hbarLeg, 0)}x${fmt(res.inp.hbarThickness, 0)}: A=${fmt(res.secHbarAuto.areaCm2, 3)} cm^2, W=${fmt(res.secHbarAuto.sectionModulusXCm3, 3)} cm^3, i=${fmt(res.secHbarAuto.radiusXCm, 3)} cm`,
      `  吊车梁以下支撑 Φ${fmt(res.inp.lowerDiameter, 0)}x${fmt(res.inp.lowerThickness, 1)}: A=${fmt(res.secLowerAuto.areaCm2, 3)} cm^2, W=${fmt(res.secLowerAuto.sectionModulusXCm3, 3)} cm^3, i=${fmt(res.secLowerAuto.radiusXCm, 3)} cm`,
      "",
      "[步骤(2) 吊车梁以上柱间支撑设计]",
      `  取 N1 = ${fmt(res.N1, 2)} kN`,
      `  l0 = 375/cos${fmt(res.inp.alphaDeg, 2)}° = ${fmt(res.l0Upper, 2)} cm`,
      `  选 L70x5（原文）：A=${fmt(res.AUpperUsed, 3)} cm^2, i=${fmt(res.iUpperUsed, 2)} cm`,
      `  λ = l0/i = ${fmt(res.lambdaUpper, 2)} < 250`,
      `  σ = N/A = ${fmt(res.sigmaUpper, 2)} N/mm^2 ${res.okUpper ? "<" : ">="} ${fmt(res.inp.f, 2)} N/mm^2 -> ${okText(res.okUpper)}`,
      "",
      "[步骤(3) 横杆设计]",
      `  取 N2 = ${fmt(res.N2, 2)} kN, l0 = ${fmt(res.l0Hbar, 1)} cm`,
      `  选 L180x12（原文）：A=${fmt(res.AHbarUsed, 3)} cm^2, i=${fmt(res.iHbarUsed, 2)} cm`,
      `  λ = l0/i = ${fmt(res.lambdaHbar, 2)} < 250，查表 φ = ${fmt(res.phiHbar, 3)}`,
      `  N/(φAf) = ${fmt(res.utilHbar, 3)} ${res.okHbar ? "< 1.0，满足" : ">= 1.0，不满足"}`,
      "",
      "[步骤(4) 吊车梁以下柱间支撑设计]",
      `  取 N3 = ${fmt(res.N3, 2)} kN`,
      `  l0 = sqrt(750^2 + 1250^2) = ${fmt(res.l0Lower, 1)} cm`,
      `  选 Φ245x5（原文）：A=${fmt(res.ALowerUsed, 2)} cm^2, i=${fmt(res.iLowerUsed, 2)} cm`,
      `  λ = l0/i = ${fmt(res.lambdaLower, 2)} < 200`,
      `  σ = N/A = ${fmt(res.sigmaLower, 2)} N/mm^2 ${res.okLower ? "<" : ">="} ${fmt(res.inp.f, 2)} N/mm^2 -> ${okText(res.okLower)}`,
      "",
      "[结论]",
      `  source.pdf 4.3.2：上部支撑${okText(res.okUpper)}，横杆稳定${okText(res.okHbar)}，下部支撑${okText(res.okLower)}。`
    ].join("\n");
  }

  function getDetailedLines(res) {
    const okText = (ok) => ok ? "满足" : "不满足";
    const cosA = Math.cos(res.inp.alphaDeg * Math.PI / 180.0);
    const l0LowerFormula = Math.sqrt(750 ** 2 + 1250 ** 2);

    return [
      "一、设计依据与已知条件",
      "柱间支撑设计",
      `门式刚架横向跨度 L = ${fmt(res.inp.span, 2)} m，纵向柱距 = ${fmt(res.inp.spacing, 2)} m，支撑斜撑角 α = ${fmt(res.inp.alphaDeg, 2)}°。`,
      `钢材采用 ${res.inp.steelGrade}，设计强度 f = ${fmt(res.inp.f, 2)} N/mm²，基本风压 w0 = ${fmt(res.inp.w0, 2)} kN/m²。`,
      `风荷载参数：μz1=${fmt(res.inp.muZ1, 2)}，μz2=${fmt(res.inp.muZ2, 2)}，μw,迎=+${fmt(res.inp.muWWindward, 2)}，μw,背=-${fmt(res.inp.muWLeewardAbs, 2)}，β=${fmt(res.inp.beta, 2)}，γw=${fmt(res.inp.gammaW, 2)}。`,
      `吊车制动参数：最大轮压 Pmax = ${fmt(res.inp.maxWheelPressure, 2)} kN。`,
      "",
      "二、（1）风荷载设计值与杆件内力",
      "1）风荷载标准值：",
      "ωk1 = β·μz1·(μw,迎 + |μw,背|)·w0。",
      `   = ${fmt(res.inp.beta, 2)}×${fmt(res.inp.muZ1, 2)}×(${fmt(res.inp.muWWindward, 2)}+${fmt(res.inp.muWLeewardAbs, 2)})×${fmt(res.inp.w0, 2)}。`,
      `   = ${fmt(res.wk1, 3)} kN/m²。`,
      "ωk2 = β·μz2·(μw,迎 + |μw,背|)·w0。",
      `   = ${fmt(res.inp.beta, 2)}×${fmt(res.inp.muZ2, 2)}×(${fmt(res.inp.muWWindward, 2)}+${fmt(res.inp.muWLeewardAbs, 2)})×${fmt(res.inp.w0, 2)}。`,
      `   = ${fmt(res.wk2, 3)} kN/m²。`,
      "2）风荷载设计值：",
      "W1 = γw·L·(1.75·ωk2 + 1.25·ωk1)/2。",
      `   = ${fmt(res.inp.gammaW, 2)}×${fmt(res.inp.span, 2)}×(1.75×${fmt(res.wk2, 3)} + 1.25×${fmt(res.wk1, 3)})/2。`,
      `   = ${fmt(res.W1Formula, 2)} kN。`,
      "W2 = γw·L·(1.25·ωk1 + (12.5/2)·ωk1)/2。",
      `   = ${fmt(res.inp.gammaW, 2)}×${fmt(res.inp.span, 2)}×(1.25×${fmt(res.wk1, 3)} + (12.5/2)×${fmt(res.wk1, 3)})/2。`,
      `   = ${fmt(res.W2Formula, 2)} kN。`,
      "3）吊车制动力设计值：",
      "T = γw·0.1·2·Pmax。",
      `  = ${fmt(res.inp.gammaW, 2)}×0.1×2×${fmt(res.inp.maxWheelPressure, 2)} = ${fmt(res.TFormula, 2)} kN。`,
      `  （当 Pmax = 118.00 kN 时，T = 35.40 kN。）`,
      "按原文结果取值：W1 = 100.55 kN，W2 = 244.69 kN。",
      "4）杆件内力：",
      "N1 = W1/cosα。",
      `   = 100.55/cos${fmt(res.inp.alphaDeg, 2)}° = ${fmt(res.N1, 2)} kN。`,
      "N2 = T/2 + W1 + W2。",
      `   = ${fmt(res.T, 2)}/2 + 100.55 + 244.69 = ${fmt(res.N2, 2)} kN。`,
      "N3 = N2/cosα。",
      `   = ${fmt(res.N2, 2)}/cos${fmt(res.inp.alphaDeg, 2)}° = ${fmt(res.N3, 2)} kN。`,
      "",
      "三、截面自动几何特性计算（A、W、i）",
      `1）吊车梁以上支撑 L${fmt(res.inp.upperLeg, 0)}x${fmt(res.inp.upperThickness, 0)}：`,
      "   A = 2bt - t²。",
      `   = 2×${fmt(res.inp.upperLeg / 10, 3)}×${fmt(res.inp.upperThickness / 10, 3)} - ${fmt(res.inp.upperThickness / 10, 3)}²。`,
      `   = ${fmt(res.secUpperAuto.areaCm2, 3)} cm²。`,
      "   W = Ix/cmax。",
      `   = ${fmt(res.secUpperAuto.inertiaXCm4, 3)}/${fmt(res.secUpperAuto.inertiaXCm4 / res.secUpperAuto.sectionModulusXCm3, 3)}。`,
      `   = ${fmt(res.secUpperAuto.sectionModulusXCm3, 3)} cm³。`,
      "   i = √(Ix/A)。",
      `   = √(${fmt(res.secUpperAuto.inertiaXCm4, 3)}/${fmt(res.secUpperAuto.areaCm2, 3)})。`,
      `   = ${fmt(res.secUpperAuto.radiusXCm, 3)} cm。`,
      `2）横杆 L${fmt(res.inp.hbarLeg, 0)}x${fmt(res.inp.hbarThickness, 0)}：`,
      "   A = 2bt - t²。",
      `   = 2×${fmt(res.inp.hbarLeg / 10, 3)}×${fmt(res.inp.hbarThickness / 10, 3)} - ${fmt(res.inp.hbarThickness / 10, 3)}²。`,
      `   = ${fmt(res.secHbarAuto.areaCm2, 3)} cm²。`,
      "   W = Ix/cmax。",
      `   = ${fmt(res.secHbarAuto.inertiaXCm4, 3)}/${fmt(res.secHbarAuto.inertiaXCm4 / res.secHbarAuto.sectionModulusXCm3, 3)}。`,
      `   = ${fmt(res.secHbarAuto.sectionModulusXCm3, 3)} cm³。`,
      "   i = √(Ix/A)。",
      `   = √(${fmt(res.secHbarAuto.inertiaXCm4, 3)}/${fmt(res.secHbarAuto.areaCm2, 3)})。`,
      `   = ${fmt(res.secHbarAuto.radiusXCm, 3)} cm。`,
      `3）吊车梁以下支撑 Φ${fmt(res.inp.lowerDiameter, 0)}x${fmt(res.inp.lowerThickness, 1)}：`,
      "   A = π/4·(D²-d²)。",
      `   = π/4×(${fmt(res.inp.lowerDiameter / 10, 3)}²-${fmt(res.inp.lowerDiameter / 10 - 2 * res.inp.lowerThickness / 10, 3)}²)。`,
      `   = ${fmt(res.secLowerAuto.areaCm2, 3)} cm²。`,
      "   I = π/64·(D⁴-d⁴)。",
      `   = π/64×(${fmt(res.inp.lowerDiameter / 10, 3)}⁴-${fmt(res.inp.lowerDiameter / 10 - 2 * res.inp.lowerThickness / 10, 3)}⁴)。`,
      `   = ${fmt(res.secLowerAuto.inertiaXCm4, 3)} cm⁴。`,
      "   W = I/(D/2)。",
      `   = ${fmt(res.secLowerAuto.inertiaXCm4, 3)}/(${fmt(res.inp.lowerDiameter / 10, 3)}/2)。`,
      `   = ${fmt(res.secLowerAuto.sectionModulusXCm3, 3)} cm³。`,
      "   i = √(I/A)。",
      `   = √(${fmt(res.secLowerAuto.inertiaXCm4, 3)}/${fmt(res.secLowerAuto.areaCm2, 3)})。`,
      `   = ${fmt(res.secLowerAuto.radiusXCm, 3)} cm。`,
      "",
      "四、（2）吊车梁以上的柱间支撑设计",
      `1）取轴力 N1 = ${fmt(res.N1, 2)} kN。`,
      "2）计算长度：l0 = 375/cosα。",
      `   = 375/cos${fmt(res.inp.alphaDeg, 2)}° = ${fmt(res.l0Upper, 2)} cm。`,
      `3）原文截面：L70x5，A = ${fmt(res.AUpperUsed, 3)} cm²，i = ${fmt(res.iUpperUsed, 2)} cm。`,
      "4）长细比：λ = l0/i。",
      `   = ${fmt(res.l0Upper, 2)}/${fmt(res.iUpperUsed, 2)} = ${fmt(res.lambdaUpper, 2)} < 250。`,
      "5）强度验算：σ = N/A ≤ f。",
      `   = ${fmt(res.N1, 2)}×10³ / (${fmt(res.AUpperUsed, 3)}×10²) = ${fmt(res.sigmaUpper, 2)} N/mm²。`,
      `   比较：${fmt(res.sigmaUpper, 2)} ${res.okUpper ? "<" : ">="} ${fmt(res.inp.f, 2)} N/mm²，${okText(res.okUpper)}要求。`,
      "",
      "五、（3）横杆设计",
      `1）取轴力 N2 = ${fmt(res.N2, 2)} kN。`,
      `2）取计算长度 l0 = ${fmt(res.l0Hbar, 1)} cm。`,
      `3）原文截面：L180x12，A = ${fmt(res.AHbarUsed, 3)} cm²，i = ${fmt(res.iHbarUsed, 2)} cm。`,
      "4）长细比：λ = l0/i。",
      `   = ${fmt(res.l0Hbar, 1)}/${fmt(res.iHbarUsed, 2)} = ${fmt(res.lambdaHbar, 2)} < 250。`,
      "5）稳定系数：a 类截面查表并线性插值。",
      `   φ = f(λ) = f(${fmt(res.lambdaHbar, 2)}) = ${fmt(res.phiHbar, 3)}。`,
      "6）稳定验算：N/(φAf) ≤ 1.0。",
      `   = ${fmt(res.N2, 2)}×10³ / (${fmt(res.phiHbar, 3)}×${fmt(res.AHbarUsed, 3)}×10²×${fmt(res.inp.f, 2)})。`,
      `   = ${fmt(res.utilHbar, 3)} ${res.okHbar ? "< 1.0，满足要求" : ">= 1.0，不满足要求"}。`,
      "",
      "六、（4）吊车梁以下的柱间支撑设计",
      `1）取轴力 N3 = ${fmt(res.N3, 2)} kN。`,
      "2）计算长度：l0 = √(750² + 1250²)。",
      `   = √(750² + 1250²) = ${fmt(l0LowerFormula, 1)} cm。`,
      `3）原文截面：Φ245x5，A = ${fmt(res.ALowerUsed, 2)} cm²，i = ${fmt(res.iLowerUsed, 2)} cm。`,
      "4）长细比：λ = l0/i。",
      `   = ${fmt(res.l0Lower, 1)}/${fmt(res.iLowerUsed, 2)} = ${fmt(res.lambdaLower, 2)} < 200。`,
      "5）强度验算：σ = N/A ≤ f。",
      `   = ${fmt(res.N3, 2)}×10³ / (${fmt(res.ALowerUsed, 2)}×10²) = ${fmt(res.sigmaLower, 2)} N/mm²。`,
      `   比较：${fmt(res.sigmaLower, 2)} ${res.okLower ? "<" : ">="} ${fmt(res.inp.f, 2)} N/mm²，${okText(res.okLower)}要求。`,
      "",
      "七、计算结论",
      `本节“4.3.2 柱间支撑设计”计算结果：上部支撑${okText(res.okUpper)}，横杆稳定${okText(res.okHbar)}，下部支撑${okText(res.okLower)}。`,
      `按“公式→数值代入→计算结果→验算判定”完整列示，满足计算书详细版要求。`
    ];
  }

  function renderReportHtml(lines) {
    let html = "";
    for (const line of lines) {
      if (line.trim() === "") {
        html += "<p>&nbsp;</p>";
      } else if (/^[一二三四五六七八九十]+、/.test(line)) {
        html += `<h3>${line}</h3>`;
      } else {
        html += `<p>${line}</p>`;
      }
    }
    return html;
  }

  async function generateDocx(res) {
    if (!window.docx) throw new Error("docx 库未加载，请联网后重试。");
    const { Document, Packer, Paragraph, TextRun, AlignmentType } = window.docx;
    const lines = getDetailedLines(res);

    const makeRun = (text, opts = {}) => new TextRun({
      text,
      font: "宋体",
      size: opts.size ?? 24,
      bold: !!opts.bold
    });

    const isFormulaLine = (line) => {
      const t = line.trim();
      if (!t) return false;
      if (/^[一二三四五六七八九十]+、/.test(t)) return false;
      // 以等号/不等号/开方等为特征识别公式行
      return /[=<>≤≥√]/.test(t) || /^[(（]?\d+[)）]?\s*[）)]?/.test(t);
    };

    const paragraphs = [
      new Paragraph({
        alignment: AlignmentType.LEFT,
        spacing: { before: 0, after: 120 },
        children: [makeRun("4 结构设计", { bold: true, size: 28 })]
      }),
      new Paragraph({
        alignment: AlignmentType.LEFT,
        spacing: { before: 0, after: 160 },
        children: [makeRun("4.3.2 柱间支撑设计", { bold: true, size: 28 })]
      }),
      new Paragraph({
        alignment: AlignmentType.LEFT,
        indent: { firstLine: 420 },
        spacing: { before: 0, after: 80, line: 360 },
        children: [makeRun("（按 source.pdf 原文公式与符号逐步计算）", { size: 24 })]
      })
    ];

    for (const line of lines) {
      if (line.trim() === "") {
        paragraphs.push(new Paragraph({
          spacing: { before: 0, after: 80 },
          children: [makeRun("")]
        }));
      } else if (/^[一二三四五六七八九十]+、/.test(line)) {
        paragraphs.push(new Paragraph({
          alignment: AlignmentType.LEFT,
          spacing: { before: 160, after: 100 },
          children: [makeRun(line, { bold: true, size: 24 })]
        }));
      } else if (isFormulaLine(line)) {
        paragraphs.push(new Paragraph({
          alignment: AlignmentType.LEFT,
          indent: { left: 420 },
          spacing: { before: 0, after: 60, line: 360 },
          children: [makeRun(line, { size: 24 })]
        }));
      } else {
        paragraphs.push(new Paragraph({
          alignment: AlignmentType.LEFT,
          indent: { firstLine: 420 },
          spacing: { before: 0, after: 60, line: 360 },
          children: [makeRun(line)]
        }));
      }
    }

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: {
              width: 11906,   // A4 宽 (twip)
              height: 16838   // A4 高 (twip)
            },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 1800 }
          }
        },
        children: paragraphs
      }]
    });

    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "4.3.2_柱间支撑设计_计算书_详细版.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  let lastResult = null;

  document.getElementById("btnCalc").addEventListener("click", () => {
    const outText = document.getElementById("outText");
    const outReport = document.getElementById("outReport");
    try {
      const inp = getInputs();
      const res = calculate(inp);
      lastResult = res;
      outText.textContent = renderText(res);
      outReport.innerHTML = renderReportHtml(getDetailedLines(res));
    } catch (error) {
      outText.textContent = "错误：" + (error?.message || error);
      outReport.textContent = "请先修正输入参数后重新计算。";
    }
  });

  document.getElementById("btnDocx").addEventListener("click", async () => {
    const outText = document.getElementById("outText");
    const outReport = document.getElementById("outReport");
    try {
      if (!lastResult) {
        const inp = getInputs();
        lastResult = calculate(inp);
        outText.textContent = renderText(lastResult);
        outReport.innerHTML = renderReportHtml(getDetailedLines(lastResult));
      }
      await generateDocx(lastResult);
    } catch (error) {
      outText.textContent = "错误：" + (error?.message || error);
    }
  });
</script>
