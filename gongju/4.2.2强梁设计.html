<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4.2.2 墙梁设计计算</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f6f8fb;
      color: #1e2a3a;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding: 16px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .full {
      grid-column: 1 / -1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #516073;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    .actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: #2563eb;
    }
    button.secondary {
      background: #0f766e;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.6;
      background: #f8fafc;
      border: 1px solid #e5eaf1;
      border-radius: 8px;
      padding: 12px;
      min-height: 180px;
      font-size: 13px;
    }
    .status {
      margin-top: 8px;
      color: #334155;
      font-size: 13px;
    }
  </style>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
  <h1>4.2.2 墙梁设计交互计算与Word生成</h1>
  <div class="wrap">
    <section class="card">
      <h2>输入参数</h2>
      <div class="grid" id="formGrid"></div>
      <div class="actions">
        <button id="btnCalc">计算并显示结果</button>
        <button id="btnDocx" class="secondary">生成Word计算书</button>
      </div>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h2>计算结果（与原py一致）</h2>
      <pre id="result">点击“计算并显示结果”后显示。</pre>
    </section>

    <section class="card full">
      <h2>详细步骤预览（与Word正文一致）</h2>
      <pre id="steps">点击“计算并显示结果”后显示。</pre>
    </section>
  </div>

  <script>
    const FIELDS = [
      ["column_spacing_m", "墙架柱柱距 l (m)", 7.5],
      ["wall_beam_spacing_m", "墙梁间距 c (m)", 1.5],
      ["basic_wind_pressure_kN_m2", "基本风压 w0 (kN/m²)", 0.40],
      ["mu_z", "风压高度变化系数 μz", 0.65],
      ["beta_wind_vibration", "风振系数 β", 1.5],
      ["gamma_wind", "风荷载分项系数 γw", 1.5],
      ["self_weight_design_kN_m", "墙梁自重荷载设计值 qg (kN/m)", 0.15],
      ["h_mm", "截面高度 h (mm)", 200.0],
      ["b_mm", "截面宽度 b (mm)", 100.0],
      ["tw_mm", "腹板厚度 tw (mm)", 3.2],
      ["tf_mm", "翼缘厚度 tf (mm)", 4.5],
      ["gamma_x", "γx", 1.05],
      ["gamma_y", "γy", 1.20],
      ["f_bending_allow_N_mm2", "抗弯设计值 f (N/mm²)", 215.0],
      ["f_shear_allow_N_mm2", "抗剪设计值 fv (N/mm²)", 125.0],
      ["E_N_mm2", "弹性模量 E (N/mm²)", 206000.0],
      ["deflection_limit_ratio", "挠度限值比 L/?", 200.0]
    ];

    const formGrid = document.getElementById("formGrid");
    for (const [name, label, val] of FIELDS) {
      const box = document.createElement("div");
      box.innerHTML = `<label for="${name}">${label}</label><input id="${name}" type="number" step="any" value="${val}" />`;
      formGrid.appendChild(box);
    }
    const zoneBox = document.createElement("div");
    zoneBox.innerHTML = `
      <label for="zone">危险区类型</label>
      <select id="zone">
        <option value="middle" selected>middle（中间部分）</option>
        <option value="corner">corner（角部）</option>
      </select>
    `;
    formGrid.appendChild(zoneBox);

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const stepsEl = document.getElementById("steps");
    const btnCalc = document.getElementById("btnCalc");
    const btnDocx = document.getElementById("btnDocx");

    function payloadFromForm() {
      const p = {};
      for (const [name] of FIELDS) p[name] = Number(document.getElementById(name).value);
      p.zone = document.getElementById("zone").value;
      return p;
    }

    function fmt(v, n = 3) {
      return Number(v).toFixed(n);
    }

    function windCoefficient(area, zone) {
      if (zone === "corner") return 0.353 * Math.log10(area) - 1.58;
      return 0.176 * Math.log10(area) - 1.28;
    }

    function calcHSectionProperties(h_mm, b_mm, tw_mm, tf_mm) {
      if (!(h_mm > 2 * tf_mm && b_mm > 0 && tw_mm > 0 && tf_mm > 0)) {
        throw new Error("截面尺寸不合理，请检查 h、b、tw、tf。");
      }

      const hWeb = h_mm - 2 * tf_mm;
      const y = h_mm / 2 - tf_mm / 2;

      const Ix_mm4 =
        2 * ((b_mm * (tf_mm ** 3)) / 12 + b_mm * tf_mm * (y ** 2)) +
        (tw_mm * (hWeb ** 3)) / 12;
      const Iy_mm4 =
        2 * (tf_mm * (b_mm ** 3)) / 12 +
        (hWeb * (tw_mm ** 3)) / 12;
      const Wx_mm3 = Ix_mm4 / (h_mm / 2);
      const Wy_mm3 = Iy_mm4 / (b_mm / 2);

      return {
        Ix_mm4,
        Iy_mm4,
        Wx_mm3,
        Wy_mm3,
        Ix_cm4: Ix_mm4 / 10000,
        Wx_cm3: Wx_mm3 / 1000,
        Wy_cm3: Wy_mm3 / 1000
      };
    }

    function designWallBeam(inp) {
      const section = calcHSectionProperties(inp.h_mm, inp.b_mm, inp.tw_mm, inp.tf_mm);
      const area = inp.column_spacing_m * inp.wall_beam_spacing_m;
      const mu_w = windCoefficient(area, inp.zone);

      const wk = inp.beta_wind_vibration * inp.mu_z * mu_w * inp.basic_wind_pressure_kN_m2;
      const qk = inp.gamma_wind * wk;

      const qh = Math.abs(qk) * inp.wall_beam_spacing_m;
      const qv = inp.self_weight_design_kN_m;

      const l_m = inp.column_spacing_m;
      const l_mm = l_m * 1000;

      const Mx = qh * (l_m ** 2) / 8;
      const My = qv * (l_m ** 2) / 8;
      const V = qh * l_m / 2;

      const sigma =
        Mx * 1e6 / (inp.gamma_x * section.Wx_mm3) +
        My * 1e6 / (inp.gamma_y * section.Wy_mm3);
      const bending_ok = sigma <= inp.f_bending_allow_N_mm2;

      const h_web = inp.h_mm - 2 * inp.tf_mm;
      const Aw = h_web * inp.tw_mm;
      const tau = V * 1000 / Aw;
      const shear_ok = tau <= inp.f_shear_allow_N_mm2;

      const qk_line = Math.abs(wk) * inp.wall_beam_spacing_m; // N/mm numerically
      const v = 5 * qk_line * (l_mm ** 4) / (384 * inp.E_N_mm2 * section.Ix_mm4);
      const v_limit = l_mm / inp.deflection_limit_ratio;
      const deflection_ok = v <= v_limit;

      return {
        input: inp,
        section,
        wind: {
          effective_area_m2: area,
          mu_w,
          wk_kN_m2: wk,
          qk_wind_kN_m2: qk,
          qh_kN_m: qh,
          qv_kN_m: qv
        },
        internal_forces: {
          Mx_kN_m: Mx,
          My_kN_m: My,
          V_kN: V
        },
        strength: {
          sigma_bending_N_mm2: sigma,
          sigma_bending_limit_N_mm2: inp.f_bending_allow_N_mm2,
          bending_ok,
          tau_shear_N_mm2: tau,
          tau_shear_limit_N_mm2: inp.f_shear_allow_N_mm2,
          shear_ok
        },
        deflection: {
          v_mm: v,
          v_limit_mm: v_limit,
          deflection_ok
        },
        overall_ok: bending_ok && shear_ok && deflection_ok
      };
    }

    function buildDetailedReportLines(res) {
      const inp = res.input;
      const sec = res.section;
      const wind = res.wind;
      const force = res.internal_forces;
      const st = res.strength;
      const dfl = res.deflection;
      const l_m = inp.column_spacing_m;
      const l_mm = l_m * 1000;
      const wk = wind.wk_kN_m2;
      const qk = wind.qk_wind_kN_m2;
      const qh = wind.qh_kN_m;
      const qv = wind.qv_kN_m;
      const h_web = inp.h_mm - 2 * inp.tf_mm;
      const aw = h_web * inp.tw_mm;
      const qk_line = Math.abs(wk) * inp.wall_beam_spacing_m;

      return [
        "一、已知条件",
        `围护墙采用双层复合保温压型钢板；山墙墙架柱柱距 l = ${fmt(inp.column_spacing_m, 2)} m；墙梁间距 c = ${fmt(inp.wall_beam_spacing_m, 2)} m；基本风压标准值 w0 = ${fmt(inp.basic_wind_pressure_kN_m2, 2)} kN/m²；墙梁自重荷载设计值 qg = ${fmt(inp.self_weight_design_kN_m, 2)} kN/m。`,
        `墙梁采用高频焊接薄壁 H 型钢 H ${fmt(inp.h_mm, 0)}×${fmt(inp.b_mm, 0)}×${fmt(inp.tw_mm, 1)}×${fmt(inp.tf_mm, 1)}，由截面尺寸自动计算：Wx = ${fmt(sec.Wx_cm3, 2)} cm³，Wy = ${fmt(sec.Wy_cm3, 2)} cm³，Ix = ${fmt(sec.Ix_cm4, 2)} cm⁴。`,
        `取风压高度变化系数 μz = ${fmt(inp.mu_z, 2)}，风振系数 β = ${fmt(inp.beta_wind_vibration, 2)}，风荷载分项系数 γw = ${fmt(inp.gamma_wind, 2)}。`,
        `抗弯塑性发展系数取 γx = ${fmt(inp.gamma_x, 2)}，γy = ${fmt(inp.gamma_y, 2)}；钢材抗弯强度设计值 f = ${fmt(inp.f_bending_allow_N_mm2, 0)} N/mm²；抗剪强度设计值 fv = ${fmt(inp.f_shear_allow_N_mm2, 0)} N/mm²；弹性模量 E = 2.06×10⁵ N/mm²。`,
        "",
        "二、风荷载计算",
        `1) 有效风荷载面积：A = l×c = ${fmt(inp.column_spacing_m, 2)}×${fmt(inp.wall_beam_spacing_m, 2)} = ${fmt(wind.effective_area_m2)} m²。`,
        `2) 危险区取${inp.zone === "corner" ? "角部" : "中间部分"}，风荷载体型系数：μw = ${inp.zone === "corner" ? "0.353·log10(A) - 1.58" : "0.176·log10(A) - 1.28"} = ${inp.zone === "corner" ? `0.353·log10(${fmt(wind.effective_area_m2)}) - 1.58` : `0.176·log10(${fmt(wind.effective_area_m2)}) - 1.28`} = ${fmt(wind.mu_w, 4)}。`,
        `3) 垂直于山墙风荷载标准值：wk = β·μz·μw·w0 = ${fmt(inp.beta_wind_vibration, 2)}×${fmt(inp.mu_z, 2)}×(${fmt(wind.mu_w, 4)})×${fmt(inp.basic_wind_pressure_kN_m2, 2)} = ${fmt(wk, 4)} kN/m²。`,
        `4) 风荷载设计值：qk = γw·wk = ${fmt(inp.gamma_wind, 2)}×(${fmt(wk, 4)}) = ${fmt(qk, 4)} kN/m²。`,
        `5) 作用于墙梁的水平风荷载设计值：qh = |qk|·c = |${fmt(qk, 4)}|×${fmt(inp.wall_beam_spacing_m, 2)} = ${fmt(qh, 4)} kN/m。`,
        `6) 墙梁竖向均布荷载（自重）取 qv = ${fmt(qv, 3)} kN/m。`,
        "",
        "三、内力计算（墙梁按简支梁）",
        `1) 强轴弯矩：Mx = qh·l²/8 = ${fmt(qh, 4)}×${fmt(l_m, 2)}²/8 = ${fmt(force.Mx_kN_m, 4)} kN·m。`,
        `2) 弱轴弯矩：My = qv·l²/8 = ${fmt(qv, 4)}×${fmt(l_m, 2)}²/8 = ${fmt(force.My_kN_m, 4)} kN·m。`,
        `3) 支座剪力：V = qh·l/2 = ${fmt(qh, 4)}×${fmt(l_m, 2)}/2 = ${fmt(force.V_kN, 4)} kN。`,
        "",
        "四、抗弯强度验算",
        "按双向弯曲应力组合验算：σ = Mx/(γx·Wx) + My/(γy·Wy)。",
        `代入计算：σ = (${fmt(force.Mx_kN_m, 4)}×10⁶)/(1.05×${fmt(sec.Wx_cm3, 2)}×10³) + (${fmt(force.My_kN_m, 4)}×10⁶)/(1.20×${fmt(sec.Wy_cm3, 2)}×10³) = ${fmt(st.sigma_bending_N_mm2, 2)} N/mm²。`,
        `比较：σ = ${fmt(st.sigma_bending_N_mm2, 2)} N/mm² ${st.bending_ok ? "≤" : ">"} ${fmt(inp.f_bending_allow_N_mm2, 2)} N/mm²，${st.bending_ok ? "满足" : "不满足"}抗弯强度要求。`,
        "",
        "五、抗剪强度验算",
        `1) 腹板计算高度：hw = h - 2tf = ${fmt(inp.h_mm, 1)} - 2×${fmt(inp.tf_mm, 1)} = ${fmt(h_web, 1)} mm。`,
        `2) 腹板受剪面积：Aw = hw·tw = ${fmt(h_web, 1)}×${fmt(inp.tw_mm, 1)} = ${fmt(aw, 2)} mm²。`,
        `3) 抗剪应力：τ = V/Aw = (${fmt(force.V_kN, 4)}×10³)/${fmt(aw, 2)} = ${fmt(st.tau_shear_N_mm2, 2)} N/mm²。`,
        `比较：τ = ${fmt(st.tau_shear_N_mm2, 2)} N/mm² ${st.shear_ok ? "≤" : ">"} ${fmt(inp.f_shear_allow_N_mm2, 2)} N/mm²，${st.shear_ok ? "满足" : "不满足"}抗剪强度要求。`,
        "",
        "六、挠度验算",
        `1) 风荷载标准值对应线荷载：qk,line = |wk|·c = |${fmt(wk, 4)}|×${fmt(inp.wall_beam_spacing_m, 2)} = ${fmt(qk_line, 4)} kN/m。`,
        "2) 简支梁均布荷载最大挠度：v = 5·q·l⁴/(384·E·I)。",
        `代入计算（q 以 N/mm，l 以 mm，I 以 mm⁴）：v = 5×${fmt(qk_line, 4)}×${fmt(l_mm, 0)}⁴/(384×${fmt(inp.E_N_mm2, 0)}×${fmt(sec.Ix_cm4, 2)}×10⁴) = ${fmt(dfl.v_mm, 3)} mm。`,
        `3) 允许挠度：v_allow = l/200 = ${fmt(l_mm, 0)}/200 = ${fmt(dfl.v_limit_mm, 3)} mm。`,
        `比较：v = ${fmt(dfl.v_mm, 3)} mm ${dfl.deflection_ok ? "≤" : ">"} ${fmt(dfl.v_limit_mm, 3)} mm，${dfl.deflection_ok ? "满足" : "不满足"}挠度要求。`,
        "",
        "七、计算结论",
        `${res.overall_ok ? `本墙梁在给定参数条件下，抗弯强度、抗剪强度及挠度验算均满足规范要求，所选 H ${fmt(inp.h_mm, 0)}×${fmt(inp.b_mm, 0)}×${fmt(inp.tw_mm, 1)}×${fmt(inp.tf_mm, 1)} 墙梁截面可采用。` : "本墙梁在给定参数条件下存在不满足项，建议调整参数或截面后复核。"}`
      ];
    }

    function buildText(res) {
      const w = res.wind, f = res.internal_forces, s = res.strength, d = res.deflection;
      const ok = v => (v ? "满足" : "不满足");
      const result = [
        "=== 4.2.2 墙梁设计自动验算结果 ===",
        `有效风荷载面积 A = ${fmt(w.effective_area_m2)} m^2`,
        `风荷载体型系数 mu_w = ${fmt(w.mu_w, 4)}`,
        `风荷载标准值 wk = ${fmt(w.wk_kN_m2, 4)} kN/m^2`,
        `风荷载设计值 qk = ${fmt(w.qk_wind_kN_m2, 4)} kN/m^2`,
        `墙梁水平线荷载 qh = ${fmt(w.qh_kN_m, 4)} kN/m`,
        `墙梁竖向线荷载 qv = ${fmt(w.qv_kN_m, 4)} kN/m`,
        "",
        `Mx = ${fmt(f.Mx_kN_m, 4)} kN·m`,
        `My = ${fmt(f.My_kN_m, 4)} kN·m`,
        `V  = ${fmt(f.V_kN, 4)} kN`,
        "",
        `抗弯应力 σ = ${fmt(s.sigma_bending_N_mm2, 2)} N/mm^2 <= ${fmt(s.sigma_bending_limit_N_mm2, 2)} N/mm^2 -> ${ok(s.bending_ok)}`,
        `抗剪应力 τ = ${fmt(s.tau_shear_N_mm2, 2)} N/mm^2 <= ${fmt(s.tau_shear_limit_N_mm2, 2)} N/mm^2 -> ${ok(s.shear_ok)}`,
        `挠度 v = ${fmt(d.v_mm, 3)} mm <= ${fmt(d.v_limit_mm, 3)} mm -> ${ok(d.deflection_ok)}`,
        "",
        `综合结论: ${res.overall_ok ? "满足设计要求" : "不满足设计要求"}`
      ].join("\n");

      const steps = buildDetailedReportLines(res).join("\n");

      return { result, steps };
    }

    function calculate() {
      statusEl.textContent = "计算中...";
      const res = designWallBeam(payloadFromForm());
      const text = buildText(res);
      resultEl.textContent = text.result;
      stepsEl.textContent = text.steps;
      statusEl.textContent = "计算完成。";
      return res;
    }

    async function generateDocxFromResult(res) {
      if (!window.docx) throw new Error("docx库未加载，请联网后重试。");

      const {
        Document,
        Packer,
        Paragraph,
        TextRun,
        AlignmentType
      } = window.docx;

      const lines = buildDetailedReportLines(res);

      const makeRun = (text, opts = {}) => new TextRun({
        text,
        font: "宋体",
        size: opts.size ?? 24, // 小四
        bold: !!opts.bold,
      });

      const paragraphs = [];
      paragraphs.push(
        new Paragraph({
          alignment: AlignmentType.LEFT,
          spacing: { before: 0, after: 160 },
          children: [makeRun("4.2.2 墙梁设计", { bold: true, size: 28 })]
        })
      );

      for (const line of lines) {
        const isHeading = /^[一二三四五六七八九十]+、/.test(line);
        const isBlank = line.trim() === "";

        if (isBlank) {
          paragraphs.push(
            new Paragraph({
              spacing: { before: 0, after: 120 },
              children: [makeRun("")]
            })
          );
          continue;
        }

        if (isHeading) {
          paragraphs.push(
            new Paragraph({
              alignment: AlignmentType.LEFT,
              spacing: { before: 160, after: 120 },
              children: [makeRun(line, { bold: true, size: 26 })]
            })
          );
          continue;
        }

        paragraphs.push(
          new Paragraph({
            alignment: AlignmentType.LEFT,
            indent: { firstLine: 420 }, // 首行缩进约2字符
            spacing: { before: 0, after: 80, line: 360 }, // 1.5倍行距
            children: [makeRun(line)]
          })
        );
      }

      const doc = new Document({
        sections: [{
          properties: {
            page: {
              margin: {
                top: 1440,
                right: 1440,
                bottom: 1440,
                left: 1800
              }
            }
          },
          children: paragraphs
        }]
      });

      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "4.2.2_墙梁设计_详细计算书.docx";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function downloadDocx() {
      statusEl.textContent = "正在生成Word计算书...";
      const res = calculate();
      await generateDocxFromResult(res);
      statusEl.textContent = "Word已生成并开始下载。";
    }

    btnCalc.addEventListener("click", () => {
      btnCalc.disabled = true;
      try {
        calculate();
      } catch (e) {
        statusEl.textContent = "错误：" + e.message;
      } finally {
        btnCalc.disabled = false;
      }
    });

    btnDocx.addEventListener("click", async () => {
      btnDocx.disabled = true;
      try {
        await downloadDocx();
      } catch (e) {
        statusEl.textContent = "错误：" + e.message;
      } finally {
        btnDocx.disabled = false;
      }
    });
  </script>
</body>
</html>
