<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抗风柱计算与计算书导出</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f6f8fa; color: #222; }
    .wrap { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    h1, h2 { margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 10px; }
    label { font-size: 13px; color: #444; display: block; margin-bottom: 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cfd8e3; border-radius: 8px; }
    .actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    button { border: 0; background: #2563eb; color: #fff; padding: 9px 14px; border-radius: 8px; cursor: pointer; }
    button.secondary { background: #475569; }
    pre { background: #0b1020; color: #d8e1ff; padding: 12px; border-radius: 8px; overflow: auto; }
    .note { color: #666; font-size: 13px; margin-top: 8px; }
    .ok { color: #0f766e; }
    .bad { color: #b91c1c; }
  </style>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>
<div class="wrap">
  <h1>抗风柱计算（前端独立版）</h1>

  <div class="card">
    <h2>4.2.4 抗风柱设计方案二（与 py 同逻辑）</h2>
    <div class="grid">
      <div><label>section-spec</label><input id="s2_sectionSpec" value="H350x350x12x19" /></div>
      <div><label>section-mode</label>
        <select id="s2_sectionMode">
          <option value="library" selected>library</option>
          <option value="auto">auto</option>
          <option value="geometry">geometry</option>
        </select>
      </div>
      <div><label>h(mm)</label><input id="s2_h" type="number" value="350" step="0.01" /></div>
      <div><label>b(mm)</label><input id="s2_b" type="number" value="350" step="0.01" /></div>
      <div><label>tw(mm)</label><input id="s2_tw" type="number" value="12" step="0.01" /></div>
      <div><label>tf(mm)</label><input id="s2_tf" type="number" value="19" step="0.01" /></div>
      <div><label>grade</label><input id="s2_grade" value="Q235" /></div>
      <div><label>f(MPa)</label><input id="s2_f" type="number" value="205" step="0.01" /></div>
      <div><label>fy(MPa)</label><input id="s2_fy" type="number" value="235" step="0.01" /></div>
      <div><label>E(MPa)</label><input id="s2_E" type="number" value="206000" step="1" /></div>
      <div><label>N(kN)</label><input id="s2_N" type="number" value="15.01" step="0.01" /></div>
      <div><label>M(kN·m)</label><input id="s2_M" type="number" value="144.79" step="0.01" /></div>
      <div><label>l0x(mm)</label><input id="s2_l0x" type="number" value="16500" step="1" /></div>
      <div><label>mu_x</label><input id="s2_mux" type="number" value="1.0" step="0.01" /></div>
      <div><label>gamma_x</label><input id="s2_gammax" type="number" value="1.05" step="0.01" /></div>
      <div><label>classx</label>
        <select id="s2_classx">
          <option value="a" selected>a</option>
          <option value="b">b</option>
          <option value="c">c</option>
          <option value="d">d</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button id="btnCalcS2">计算方案二</button>
      <button id="btnDocxS2" class="secondary">生成方案二详细版 .docx</button>
    </div>
    <pre id="s2_out">点击“计算方案二”后显示结果</pre>
    <div class="note">说明：Word 计算书按 4.2.4 方案二步骤逐条展开。</div>
  </div>

</div>

<script>
  const STABILITY_TABLES = {
    a: [[0,1.000],[50,0.90],[80,0.74],[100,0.60],[108.6,0.544],[120,0.49],[150,0.33],[200,0.19],[240,0.131]],
    b: [[0,1.000],[50,0.88],[80,0.70],[95.6,0.561],[100,0.54],[120,0.44],[150,0.30],[200,0.18],[240,0.12]]
  };

  const SECTION_LIBRARY = {
    "H350X350X12X19": {
      A_mm2: 173.9 * 100.0,
      Wx_mm3: 2300.0 * 1e3,
      Ix_mm4: 40300.0 * 1e4,
      ix_mm: 15.2 * 10.0,
      section_source: "手册值",
      section_spec_used: "H350X350X12X19"
    }
  };

  function fmt(n, d=2) { return Number(n).toFixed(d); }

  function normalizeSectionSpec(spec) {
    let s = String(spec || "").trim().toUpperCase().replaceAll("*","X").replaceAll("×","X").replaceAll(" ","");
    if (!s.startsWith("H")) s = "H" + s;
    return s;
  }

  function sectionFromSpec(spec) {
    const norm = normalizeSectionSpec(spec);
    const parts = norm.slice(1).split("X");
    if (parts.length !== 4) throw new Error(`截面规格格式错误: ${spec}，示例: H350x350x12x19`);
    const [h,b,tw,tf] = parts.map(Number);
    return { h_mm:h, b_mm:b, tw_mm:tw, tf_mm:tf };
  }

  function sectionProperties(section) {
    const h = section.h_mm, b = section.b_mm, tw = section.tw_mm, tf = section.tf_mm;
    const A = 2*b*tf + (h - 2*tf)*tw;
    const web_h = h - 2*tf;
    const Ix = 2 * ((b * tf**3)/12 + b*tf*(h/2 - tf/2)**2) + (tw * web_h**3)/12;
    const Wx = Ix / (h/2);
    const ix = Math.sqrt(Ix / A);
    return { A_mm2:A, Ix_mm4:Ix, Wx_mm3:Wx, ix_mm:ix };
  }

  function resolveSectionProperties(inp) {
    const mode = String(inp.section_mode).toLowerCase();
    const spec = normalizeSectionSpec(inp.section_spec);
    if (!["library","auto","geometry"].includes(mode)) throw new Error("section_mode 仅支持: library/auto/geometry");

    if ((mode === "library" || mode === "auto") && SECTION_LIBRARY[spec]) {
      return { ...SECTION_LIBRARY[spec] };
    }
    if (mode === "library") {
      throw new Error(`截面 ${spec} 不在 SECTION_LIBRARY 中。如需严格复现手册值，请先在 SECTION_LIBRARY 录入该规格。`);
    }
    const g = sectionProperties(inp.section);
    return {
      ...g,
      section_source: "几何近似计算值",
      section_spec_used: `H${inp.section.h_mm}X${inp.section.b_mm}X${inp.section.tw_mm}X${inp.section.tf_mm}`
    };
  }

  function interpolatePhi(lambdaBar, sectionClass) {
    const key = String(sectionClass).toLowerCase();
    const table = STABILITY_TABLES[key];
    if (!table) throw new Error(`未找到截面类别 ${sectionClass} 的稳定系数表`);
    if (lambdaBar <= table[0][0]) return table[0][1];
    if (lambdaBar >= table[table.length-1][0]) return table[table.length-1][1];
    for (let i=0; i<table.length-1; i++) {
      const [x1,y1] = table[i], [x2,y2] = table[i+1];
      if (lambdaBar >= x1 && lambdaBar <= x2) {
        const t = (lambdaBar - x1) / (x2 - x1);
        return y1 + t * (y2 - y1);
      }
    }
    throw new Error("稳定系数插值失败");
  }

  function runScheme2(inp) {
    const prop = resolveSectionProperties(inp);
    const A = prop.A_mm2, Wx = prop.Wx_mm3, ix = prop.ix_mm, Ix = prop.Ix_mm4;
    const sigmaStrength = inp.n_kN*1e3/A + inp.m_kN_m*1e6/(inp.gamma_x*Wx);
    const lambdaX = inp.l0x_mm / ix;
    const epsilonK = Math.sqrt(235.0 / inp.material.fy_n_mm2);
    const lambdaBar = lambdaX / epsilonK;
    const phiX = interpolatePhi(lambdaBar, inp.section_class);
    const Nex = (Math.PI**2) * inp.material.e_n_mm2 * A / (1.1 * lambdaX**2) / 1e3;
    const Ncr = (Math.PI**2) * inp.material.e_n_mm2 * Ix / ((inp.mu_x * inp.l0x_mm)**2) / 1e3;
    const betaMx = Math.max(1.0 - 0.18*inp.n_kN/Ncr, 1.0);
    const sigmaStab = inp.n_kN*1e3/(phiX*A) + betaMx*inp.m_kN_m*1e6/(inp.gamma_x*Wx*(1.0 - 0.8*inp.n_kN/Nex));
    return {
      ...prop,
      sigma_strength_n_mm2: sigmaStrength,
      lambda_x: lambdaX,
      lambda_bar: lambdaBar,
      phi_x: phiX,
      Nex_kN: Nex,
      Ncr_kN: Ncr,
      beta_mx: betaMx,
      sigma_stability_n_mm2: sigmaStab,
      ok_strength: sigmaStrength <= inp.material.f_n_mm2,
      ok_stability: sigmaStab <= inp.material.f_n_mm2
    };
  }

  function scheme2Text(inp, res) {
    return [
      "=== 4.2.4 抗风柱设计方案二 自动计算 ===",
      `截面: ${res.section_spec_used}`,
      `钢材: ${inp.material.grade}, f=${fmt(inp.material.f_n_mm2,2)} MPa, fy=${fmt(inp.material.fy_n_mm2,2)} MPa`,
      `截面特性来源: ${res.section_source}`,
      "",
      "[1] 截面特性自动计算",
      `A  = ${fmt(res.A_mm2/100,2)} cm^2`,
      `Wx = ${fmt(res.Wx_mm3/1e3,2)} cm^3`,
      `Ix = ${fmt(res.Ix_mm4/1e4,2)} cm^4`,
      `ix = ${fmt(res.ix_mm/10,2)} cm`,
      "",
      "[2] 强度验算",
      `N = ${fmt(inp.n_kN,2)} kN, M = ${fmt(inp.m_kN_m,2)} kN·m`,
      `sigma = ${fmt(res.sigma_strength_n_mm2,2)} MPa <= ${fmt(inp.material.f_n_mm2,2)} MPa ? ${res.ok_strength}`,
      "",
      "[3] 平面内稳定验算",
      `lambda_x = ${fmt(res.lambda_x,2)}`,
      `lambda_bar = ${fmt(res.lambda_bar,2)}`,
      `phi_x(查表插值) = ${fmt(res.phi_x,3)}`,
      `Nex' = ${fmt(res.Nex_kN,2)} kN`,
      `Ncr  = ${fmt(res.Ncr_kN,2)} kN`,
      `beta_mx = ${fmt(res.beta_mx,3)}`,
      `sigma_stab = ${fmt(res.sigma_stability_n_mm2,2)} MPa <= ${fmt(inp.material.f_n_mm2,2)} MPa ? ${res.ok_stability}`,
      "",
      "注: 因为墙梁外侧和墙板的支撑作用，所以不验算其稳定性。"
    ].join("\n");
  }

  function buildScheme2DetailedReportLines(inp, res) {
    const epsilonK = Math.sqrt(235.0 / inp.material.fy_n_mm2);
    const betaRaw = 1.0 - 0.18 * inp.n_kN / res.Ncr_kN;
    return [
      "一、已知条件",
      `钢材等级：${inp.material.grade}；设计强度 f = ${fmt(inp.material.f_n_mm2,2)} N/mm²；屈服强度 fy = ${fmt(inp.material.fy_n_mm2,2)} N/mm²；弹性模量 E = ${fmt(inp.material.e_n_mm2,2)} N/mm²。`,
      `截面规格：${res.section_spec_used}；截面特性来源：${res.section_source}。`,
      `内力取值：N = ${fmt(inp.n_kN,2)} kN，M = ${fmt(inp.m_kN_m,2)} kN·m；计算长度 l0x = ${fmt(inp.l0x_mm,2)} mm；mu_x = ${fmt(inp.mu_x,2)}；gamma_x = ${fmt(inp.gamma_x,2)}。`,
      "",
      "二、截面特性",
      `A = ${fmt(res.A_mm2/100,2)} cm²，Wx = ${fmt(res.Wx_mm3/1e3,2)} cm³，Ix = ${fmt(res.Ix_mm4/1e4,2)} cm⁴，ix = ${fmt(res.ix_mm/10,2)} cm。`,
      "",
      "三、（1）强度验算",
      "按公式：σ = N/A + M/(γx·Wx)。",
      `代入：σ = ${fmt(inp.n_kN,2)}×10³/(${fmt(res.A_mm2,2)}) + ${fmt(inp.m_kN_m,2)}×10⁶/(${fmt(inp.gamma_x,2)}×${fmt(res.Wx_mm3,2)}) = ${fmt(res.sigma_strength_n_mm2,2)} N/mm²。`,
      `比较：σ = ${fmt(res.sigma_strength_n_mm2,2)} N/mm² ${res.ok_strength ? "≤" : ">"} ${fmt(inp.material.f_n_mm2,2)} N/mm²，强度${res.ok_strength ? "满足" : "不满足"}要求。`,
      "",
      "四、（2）弯矩作用平面内稳定性计算",
      `1) 长细比：λx = l0x/ix = ${fmt(inp.l0x_mm,2)}/${fmt(res.ix_mm,2)} = ${fmt(res.lambda_x,2)}。`,
      `2) 修正长细比：εk = √(235/fy) = √(235/${fmt(inp.material.fy_n_mm2,2)}) = ${fmt(epsilonK,4)}；λ = λx/εk = ${fmt(res.lambda_x,2)}/${fmt(epsilonK,4)} = ${fmt(res.lambda_bar,2)}。`,
      `3) 稳定系数：按 ${inp.section_class} 类截面查表并线性插值，取 φx = ${fmt(res.phi_x,3)}。`,
      `4) 弹性屈曲力：Nex' = π²EA/(1.1·λx²) = ${fmt(res.Nex_kN,2)} kN。`,
      `5) 临界力：Ncr = π²EIx/(μx·l0x)² = ${fmt(res.Ncr_kN,2)} kN。`,
      `6) 等效弯矩系数：βmx = 1 - 0.18·N/Ncr = 1 - 0.18×${fmt(inp.n_kN,2)}/${fmt(res.Ncr_kN,2)} = ${fmt(betaRaw,3)}，按规范取不小于 1.0，故 βmx = ${fmt(res.beta_mx,3)}。`,
      "7) 按公式（4.18）验算：σ = N/(φx·A) + βmx·M/[γx·Wx·(1-0.8N/Nex')]。",
      `代入：σ = ${fmt(inp.n_kN,2)}×10³/(${fmt(res.phi_x,3)}×${fmt(res.A_mm2,2)}) + ${fmt(res.beta_mx,3)}×${fmt(inp.m_kN_m,2)}×10⁶/(${fmt(inp.gamma_x,2)}×${fmt(res.Wx_mm3,2)}×(1-0.8×${fmt(inp.n_kN,2)}/${fmt(res.Nex_kN,2)})) = ${fmt(res.sigma_stability_n_mm2,2)} N/mm²。`,
      `比较：σ = ${fmt(res.sigma_stability_n_mm2,2)} N/mm² ${res.ok_stability ? "≤" : ">"} ${fmt(inp.material.f_n_mm2,2)} N/mm²，平面内稳定${res.ok_stability ? "满足" : "不满足"}要求。`,
      "",
      "五、（3）弯矩作用平面外稳定性计算",
      "因为墙梁外侧和墙板的支撑作用，所以不验算其稳定性。",
      "",
      "六、计算结论",
      `抗风柱方案二验算结果：强度${res.ok_strength ? "满足" : "不满足"}，平面内稳定${res.ok_stability ? "满足" : "不满足"}。`
    ];
  }

  async function generateScheme2Docx(inp, res) {
    if (!window.docx) throw new Error("docx库未加载，请联网后重试。");
    const {
      Document,
      Packer,
      Paragraph,
      TextRun,
      AlignmentType
    } = window.docx;

    const lines = buildScheme2DetailedReportLines(inp, res);
    const makeRun = (text, opts = {}) => new TextRun({
      text,
      font: "宋体",
      size: opts.size ?? 24,
      bold: !!opts.bold
    });

    const paragraphs = [];
    paragraphs.push(
      new Paragraph({
        alignment: AlignmentType.LEFT,
        spacing: { before: 0, after: 160 },
        children: [makeRun("4.2.4 抗风柱设计方案二", { bold: true, size: 28 })]
      })
    );
    paragraphs.push(
      new Paragraph({
        alignment: AlignmentType.LEFT,
        indent: { firstLine: 420 },
        spacing: { before: 0, after: 80, line: 360 },
        children: [makeRun("（依据 PDF“4.2.4 抗风柱设计方案二”逐步展开计算）")]
      })
    );

    for (const line of lines) {
      const isHeading = /^[一二三四五六七八九十]+、/.test(line);
      const isBlank = line.trim() === "";

      if (isBlank) {
        paragraphs.push(
          new Paragraph({
            spacing: { before: 0, after: 120 },
            children: [makeRun("")]
          })
        );
        continue;
      }

      if (isHeading) {
        paragraphs.push(
          new Paragraph({
            alignment: AlignmentType.LEFT,
            spacing: { before: 160, after: 120 },
            children: [makeRun(line, { bold: true, size: 26 })]
          })
        );
        continue;
      }

      paragraphs.push(
        new Paragraph({
          alignment: AlignmentType.LEFT,
          indent: { firstLine: 420 },
          spacing: { before: 0, after: 80, line: 360 },
          children: [makeRun(line)]
        })
      );
    }

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            margin: {
              top: 1440,
              right: 1440,
              bottom: 1440,
              left: 1800
            }
          }
        },
        children: paragraphs
      }]
    });
    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "4.2.4_抗风柱设计方案二_计算书_详细版.docx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function getScheme2Input() {
    const sectionSpec = document.getElementById("s2_sectionSpec").value;
    const sectionMode = document.getElementById("s2_sectionMode").value;
    const secGeom = {
      h_mm: Number(document.getElementById("s2_h").value),
      b_mm: Number(document.getElementById("s2_b").value),
      tw_mm: Number(document.getElementById("s2_tw").value),
      tf_mm: Number(document.getElementById("s2_tf").value)
    };
    return {
      section: sectionMode === "geometry" ? secGeom : sectionFromSpec(sectionSpec),
      material: {
        grade: document.getElementById("s2_grade").value,
        f_n_mm2: Number(document.getElementById("s2_f").value),
        fy_n_mm2: Number(document.getElementById("s2_fy").value),
        e_n_mm2: Number(document.getElementById("s2_E").value)
      },
      n_kN: Number(document.getElementById("s2_N").value),
      m_kN_m: Number(document.getElementById("s2_M").value),
      l0x_mm: Number(document.getElementById("s2_l0x").value),
      mu_x: Number(document.getElementById("s2_mux").value),
      gamma_x: Number(document.getElementById("s2_gammax").value),
      section_class: document.getElementById("s2_classx").value,
      section_mode: sectionMode,
      section_spec: sectionSpec
    };
  }

  let scheme2Last = null;

  document.getElementById("btnCalcS2").addEventListener("click", () => {
    const out = document.getElementById("s2_out");
    try {
      const inp = getScheme2Input();
      const res = runScheme2(inp);
      scheme2Last = { inp, res };
      out.textContent = scheme2Text(inp, res);
    } catch (e) {
      out.textContent = "错误: " + (e?.message || e);
    }
  });

  document.getElementById("btnDocxS2").addEventListener("click", async () => {
    const out = document.getElementById("s2_out");
    try {
      if (!scheme2Last) {
        const inp = getScheme2Input();
        const res = runScheme2(inp);
        scheme2Last = { inp, res };
        out.textContent = scheme2Text(inp, res);
      }
      await generateScheme2Docx(scheme2Last.inp, scheme2Last.res);
    } catch (e) {
      out.textContent = "错误: " + (e?.message || e);
    }
  });

</script>
</body>
</html>
